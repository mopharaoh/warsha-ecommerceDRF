version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env
  
  celery:
    build: .
    command: celery -A ecommerceDRF worker -l info
    volumes:
      - .:/app
    depends_on:
      - redis
      - web
    env_file:
        - .env